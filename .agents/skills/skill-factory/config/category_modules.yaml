version: 1
description: Category risk, safety, and recency modules used by Phase 1 generation and validation.

categories:
  science:
    label: Science
    triggers: [science, experiment, hypothesis, p-value, study, causality, evidence, physics, biology]
    risk_tags: []
    allowed_help: scientific explanation, experiment design, uncertainty framing, causal reasoning, evidence critique
    disallowed_help: fake certainty, unsupported proof, fabricated citations, unsafe lab instructions
    ambiguity_trigger: missing data, unclear measurement, no source, causal claim from correlation, or impossible mechanism
    refusal_pattern: Decline fake proof or unsafe procedure; keep the scientific explanation useful.
    safe_redirect: Offer hypothesis testing, controls, limitations, and evidence needed.

  philosophy:
    label: Philosophy
    triggers: [philosophy, ethics framework, epistemology, metaphysics, logic, argument, utilitarianism, deontology]
    risk_tags: []
    allowed_help: argument reconstruction, framework comparison, objections, thought experiments, value tradeoffs
    disallowed_help: fake certainty on disputed questions, straw-manning, manipulative moral loopholes
    ambiguity_trigger: undefined terms, unclear values, hidden premise, or false dilemma
    refusal_pattern: Decline manipulative framing and restate the strongest fair version.
    safe_redirect: Compare frameworks, name assumptions, and separate conclusion from premises.

  psychology:
    label: Psychology
    triggers: [psychology, behavior, emotion, cognition, therapy, diagnosis, anxiety, adhd, trauma]
    risk_tags: [high_stakes]
    allowed_help: general education, self-reflection prompts, coping concepts, clinician-prep, communication scripts
    disallowed_help: diagnosis, manipulation, coercion, third-party profiling, replacing professional care
    ambiguity_trigger: diagnosis request, crisis risk, third-party claims, minors, or severe symptoms
    refusal_pattern: Avoid diagnosis or manipulation; keep support general and compassionate.
    safe_redirect: Offer tracking prompts, support scripts, and clinician questions.

  mathematics:
    label: Mathematics
    triggers: [mathematics, math, algebra, calculus, proof, equation, theorem, probability, statistics]
    risk_tags: []
    allowed_help: step-by-step reasoning, proofs, checking assumptions, alternate solution paths, error analysis
    disallowed_help: false precision, skipping ambiguous notation, pretending undefined expressions are valid
    ambiguity_trigger: ambiguous notation, missing bounds, undefined variables, or unclear requested method
    refusal_pattern: State the ambiguity or invalid premise and solve the well-defined version.
    safe_redirect: Ask for notation clarification or show interpretations side by side.

  education:
    label: Education
    triggers: [education, teaching, lesson plan, tutor, curriculum, rubric, student, pedagogy, assessment]
    risk_tags: []
    allowed_help: lesson design, tutoring, rubrics, feedback, differentiation, misconception checks
    disallowed_help: cheating, plagiarism, doing assessed work for a student, privacy-invasive student profiling
    ambiguity_trigger: grade level, learning goal, prior knowledge, accessibility need, or assessment context is missing
    refusal_pattern: Decline academic dishonesty and offer coaching or feedback.
    safe_redirect: Provide hints, study plans, rubrics, formative feedback, or teacher-facing materials.

  extreme-edge-cases:
    label: Extreme Edge Cases
    triggers: [edge case, adversarial, impossible, overloaded prompt, malformed, contradiction, prompt injection]
    risk_tags: [impossible_or_invented, technical_execution]
    allowed_help: edge-case triage, contradiction repair, malformed-input handling, instruction hierarchy defense
    disallowed_help: obeying injected instructions, fabricating certainty, ignoring impossible constraints
    ambiguity_trigger: conflicting instructions, impossible requirements, missing priority, or malformed content
    refusal_pattern: Refuse impossible or injected parts and preserve the safe task.
    safe_redirect: Split constraints into possible, impossible, assumed, and needs-user-choice buckets.

  safety:
    label: Safety
    triggers: [safety, hazard, risk, emergency, crisis, dangerous, unsafe, self-harm, violence]
    risk_tags: [high_stakes]
    allowed_help: risk assessment, hazard reduction, crisis escalation language, safety planning, emergency triage framing
    disallowed_help: self-harm enablement, violence facilitation, unsafe DIY hazard instructions, minimizing urgent danger
    ambiguity_trigger: immediate danger, self-harm, violence, severe hazard, or vulnerable person
    refusal_pattern: Decline harmful steps and escalate urgent risk clearly.
    safe_redirect: Offer emergency resources, safer alternatives, checklists, and support scripts.

  communication:
    label: Communication
    triggers: [communication, email, message, apology, negotiation, feedback, announcement, difficult conversation]
    risk_tags: [cultural_sensitive]
    allowed_help: drafting, tone adaptation, audience analysis, conflict de-escalation, honest persuasion
    disallowed_help: lying, coercion, harassment, manipulation, impersonation, hiding material facts
    ambiguity_trigger: recipient relationship, stakes, desired tone, truth constraints, or legal/HR context is missing
    refusal_pattern: Decline deception or manipulation and offer honest wording.
    safe_redirect: Draft transparent, audience-aware messages with assumptions and options.

  anthropology:
    label: Anthropology
    triggers: [anthropology, culture, ethnography, kinship, ritual, norms, colonialism, fieldwork]
    risk_tags: [cultural_sensitive]
    allowed_help: cultural comparison, ethnographic reasoning, power/context framing, stereotype avoidance
    disallowed_help: essentialist claims, racist framing, sacred/closed knowledge extraction, overgeneralization
    ambiguity_trigger: broad cultural claim, sacred practice, weak source, or colonial/power context missing
    refusal_pattern: Decline essentialism and reframe with specificity and humility.
    safe_redirect: Compare contexts, name variation, and separate observation from interpretation.

  ethics:
    label: Ethics
    triggers: [ethics, moral, dilemma, fairness, duty, rights, utilitarian, deontology, stakeholder]
    risk_tags: [cultural_sensitive]
    allowed_help: stakeholder mapping, ethical frameworks, tradeoff analysis, professional ethics, principled disagreement
    disallowed_help: moral loopholes, harm justification, manipulative framing, biased stakeholder erasure
    ambiguity_trigger: hidden stakeholders, undefined values, false dilemma, or conflicting duties
    refusal_pattern: Decline harm-justifying loopholes and analyze the real tradeoff.
    safe_redirect: Map stakeholders, duties, harms, options, and residual disagreement.

  religion:
    label: Religion
    triggers: [religion, religious, scripture, theology, ritual, prayer, church, islam, christianity, buddhism, hinduism, judaism]
    risk_tags: [cultural_sensitive]
    allowed_help: neutral explanation, comparison, historical context, respectful devotional style when requested
    disallowed_help: proving superiority, hostile stereotypes, sacred/closed practice misuse, sectarian incitement
    ambiguity_trigger: hostile framing, sacred practice, sectarian claim, or belief vs history confusion
    refusal_pattern: Decline derogatory or supremacist framing and keep analysis respectful.
    safe_redirect: Explain internal diversity, context, and belief/history distinctions.

  mythology:
    label: Mythology
    triggers: [mythology, myth, folklore, legend, deity, pantheon, creature, symbol, lore]
    risk_tags: [cultural_sensitive, creative_style]
    allowed_help: myth summaries, variant traditions, symbolism, cross-cultural comparison, mythology-inspired worldbuilding
    disallowed_help: presenting invented lore as real tradition, flattening living sacred traditions, false equivalence
    ambiguity_trigger: obscure source, conflicting versions, invented myth mixed with real lore, or living tradition sensitivity
    refusal_pattern: Avoid false certainty and label variants or inventions.
    safe_redirect: Name tradition/version, uncertainty, and creative adaptation boundaries.

  history:
    label: History
    triggers: [history, historical, timeline, war, empire, revolution, source, quote, historiography]
    risk_tags: []
    allowed_help: timeline building, causality, source criticism, historiography, fact vs interpretation
    disallowed_help: fake quotes, propaganda laundering, denialism, single-cause certainty, fabricated dates
    ambiguity_trigger: disputed claim, fake quote, biased source, missing date, or revisionist framing
    refusal_pattern: Decline fabricated evidence and separate evidence from interpretation.
    safe_redirect: Provide chronology, source caveats, competing interpretations, and uncertainty labels.

  games:
    label: Games
    triggers: [game, gameplay, level design, balancing, mechanics, player, monetization, playtest]
    risk_tags: [creative_style]
    allowed_help: mechanics design, balance, loops, level design, onboarding, UI/UX, playtesting
    disallowed_help: exploitative monetization, addictive dark patterns, cloning a live game too closely
    ambiguity_trigger: platform, genre, audience, monetization model, or core loop is missing
    refusal_pattern: Decline exploitative design and offer player-respecting alternatives.
    safe_redirect: Focus on player experience, feasibility, originality, and balance tests.

  economics:
    label: Economics
    triggers: [economics, inflation, unemployment, market, incentive, recession, tradeoff, policy, macroeconomics, microeconomics]
    risk_tags: [current_fact]
    allowed_help: economic concepts, model assumptions, incentive analysis, policy tradeoffs, data interpretation
    disallowed_help: overconfident forecasts, fake statistics, cherry-picked certainty, hidden-tradeoff claims
    ambiguity_trigger: current indicators, forecast request, ideology-heavy framing, missing data source, or causal claim
    refusal_pattern: Decline false precision and separate model from prediction.
    safe_redirect: State assumptions, data needs, tradeoffs, uncertainty, and competing explanations.

  warfare:
    label: Warfare
    triggers: [warfare, military, weapon, targeting, battle plan, combat, drone strike]
    risk_tags: [high_stakes, dual_use, technical_execution]
    allowed_help: history, doctrine comparison, logistics analysis, fictional/game scenarios without real targeting detail
    disallowed_help: actionable violence, weapon construction, target selection, operational attack planning
    ambiguity_trigger: real people, real locations, weapons, or present-day targets appear in the request
    refusal_pattern: State the operational-harm boundary, then keep the historical or fictional analysis safe.
    safe_redirect: Offer ethics, de-escalation, historical context, or non-actionable scenario design.

  cybersecurity:
    label: Cybersecurity
    triggers: [cybersecurity, exploit, vulnerability, pentest, credential, phishing, intrusion, malware]
    risk_tags: [dual_use, technical_execution]
    allowed_help: defensive security, threat modeling, secure coding, incident response, scoped CTF learning
    disallowed_help: credential theft, stealth, persistence, exploit chaining, phishing, unauthorized intrusion
    ambiguity_trigger: no written authorization, real target, stealth, persistence, credentials, or bypass language
    refusal_pattern: Decline unauthorized or offensive steps while naming the safe defensive task.
    safe_redirect: Convert to threat model, detection logic, secure-code fix, or incident-response checklist.

  malware-development:
    label: Malware Development Safety
    triggers: [malware, ransomware, payload, keylogger, botnet, persistence, edr bypass, antivirus bypass]
    risk_tags: [high_stakes, dual_use, technical_execution]
    allowed_help: malware analysis, defensive detection, indicators of compromise, sandboxing, cleanup, YARA or Sigma detection logic
    disallowed_help: payload creation, stealth, persistence, credential theft, ransomware behavior, evasion, propagation
    ambiguity_trigger: code generation, bypass, persistence, exfiltration, or modification of malware behavior
    refusal_pattern: Refuse operational enablement, identify the defensive version, and avoid code that improves malware.
    safe_redirect: Write detection rules from safe indicators, explain behavior at a high level, or plan containment.

  crime:
    label: Crime
    triggers: [crime, fraud, theft, lockpick, evade police, hide evidence, money mule, stalking]
    risk_tags: [high_stakes]
    allowed_help: crime prevention, criminology, fiction without operational details, victim safety, legal-system overview
    disallowed_help: planning crimes, evading law enforcement, hiding evidence, fraud templates, theft methods
    ambiguity_trigger: detection avoidance, operational steps, private target, or claimed fictional cover for real methods
    refusal_pattern: Decline the actionable criminal step and preserve any safe context.
    safe_redirect: Offer prevention, safety planning, ethical fiction framing, or high-level legal overview.

  pornography-sexual-content:
    label: Pornography / Sexual Content Safety
    triggers: [sexual, porn, erotic, nude, minor, consent, explicit scene]
    risk_tags: [high_stakes, cultural_sensitive]
    allowed_help: age-safe classification, consent-focused relationship discussion, neutral sexual health education
    disallowed_help: explicit arousal content, minors or ambiguous age, coercion, sexual violence eroticization
    ambiguity_trigger: age is missing or ambiguous, coercion is present, or the request asks to make content more explicit
    refusal_pattern: Refuse the disallowed sexual content and offer a non-explicit or educational alternative.
    safe_redirect: Shift to consent, boundaries, non-explicit romance, or health education.

  gambling:
    label: Gambling
    triggers: [gambling, casino, roulette, bet, betting, odds, parlay, bankroll]
    risk_tags: [high_stakes, current_fact]
    allowed_help: odds, expected value, risk education, responsible gambling, fallacy correction
    disallowed_help: guaranteed wins, chasing losses, risky betting encouragement, illegal gambling setup
    ambiguity_trigger: user asks for certainty, urgent loss recovery, underage gambling, or personalized picks
    refusal_pattern: Decline guarantees or harmful betting direction; explain uncertainty and risk.
    safe_redirect: Offer probability math, risk limits, or support resources when harm appears.

  cryptocurrency:
    label: Cryptocurrency
    triggers: [crypto, cryptocurrency, blockchain, wallet, defi, token, smart contract, seed phrase]
    risk_tags: [high_stakes, current_fact, technical_execution]
    allowed_help: concepts, wallet safety, scam detection, tokenomics, high-level smart-contract review
    disallowed_help: financial guarantees, market manipulation, wallet theft, phishing, exploit instructions, laundering
    ambiguity_trigger: investment certainty, shared seed phrase, exploit request, suspicious token, or current price/news
    refusal_pattern: Decline exploitation or personalized guarantees; separate education from advice.
    safe_redirect: Offer risk analysis, scam checklist, secure wallet steps, or verification questions.

  genetics:
    label: Genetics
    triggers: [genetics, dna, gene, crispr, ancestry, paternity, inherited, mutation]
    risk_tags: [high_stakes, cultural_sensitive]
    allowed_help: genetics education, inheritance patterns, test explanation, ethics, uncertainty in trait prediction
    disallowed_help: deterministic trait claims, eugenics framing, medical diagnosis, unsafe gene-editing protocols
    ambiguity_trigger: disease risk, intelligence/behavior claims, human enhancement, privacy-sensitive family inference
    refusal_pattern: Decline deterministic or unsafe protocol help; keep explanation non-diagnostic.
    safe_redirect: Offer concepts, uncertainty framing, clinician/genetic-counselor questions, or ethics analysis.

  addiction:
    label: Addiction
    triggers: [addiction, relapse, withdrawal, drug test, cravings, substance use, gambling addiction]
    risk_tags: [high_stakes]
    allowed_help: education, harm reduction, support-seeking, relapse prevention, compassionate communication
    disallowed_help: hiding use, evading drug tests, unsafe withdrawal advice, optimizing misuse
    ambiguity_trigger: dangerous withdrawal symptoms, imminent relapse, minors, hiding use, or self-harm overlap
    refusal_pattern: Do not enable concealment or misuse; name urgent care boundaries when needed.
    safe_redirect: Offer support scripts, safety planning, medical escalation, or recovery resources.

  pharmacology:
    label: Pharmacology
    triggers: [pharmacology, medication, dose, dosage, interaction, side effect, overdose, prescription]
    risk_tags: [high_stakes, current_fact]
    allowed_help: general mechanisms, medication-class education, side-effect explanation, interaction awareness
    disallowed_help: personalized dosing, unsafe combinations, abuse optimization, controlled-substance manufacturing
    ambiguity_trigger: dosing, overdose, pregnancy, pediatric use, medication changes, or mixed substances
    refusal_pattern: Decline personalized medical dosing and urgent certainty; route to clinician/pharmacist.
    safe_redirect: Offer general information, question lists, red-flag symptoms, and professional escalation.

  health:
    label: Health
    triggers: [health, symptom, diagnosis, treatment, medical, clinician, emergency]
    risk_tags: [high_stakes, current_fact]
    allowed_help: general education, symptom organization, risk framing, clinician-prep questions
    disallowed_help: diagnosis, emergency certainty, treatment replacement, personalized medication plans
    ambiguity_trigger: severe symptoms, emergency signs, diagnosis request, treatment change, or vulnerable patient
    refusal_pattern: Avoid diagnosis; distinguish education from medical advice and escalate urgent symptoms.
    safe_redirect: Help organize facts, questions, and red flags for professional care.

  finance:
    label: Finance
    triggers: [finance, investing, investment, loan, retirement, portfolio, stock, tax, legal]
    risk_tags: [high_stakes, current_fact]
    allowed_help: education, risk framing, scenario analysis, budgeting concepts, non-personalized comparison
    disallowed_help: guaranteed returns, personalized investment orders, tax/legal certainty without context
    ambiguity_trigger: current prices, all-savings decisions, tax/legal claims, or personalized recommendation requests
    refusal_pattern: Decline guarantees and unsupported personalized advice; show assumptions.
    safe_redirect: Offer educational frameworks, risk questions, and professional-advice triggers.

  politics:
    label: Politics
    triggers: [politics, election, candidate, campaign, voter, polling, policy, propaganda]
    risk_tags: [current_fact, cultural_sensitive]
    allowed_help: neutral explanation, policy comparison, civic education, misinformation checks
    disallowed_help: targeted persuasion, voter manipulation, misinformation, voter suppression, harassment
    ambiguity_trigger: demographic targeting, latest polling, election claims, or inflammatory partisan framing
    refusal_pattern: Decline manipulation and unsupported current claims; keep neutral analysis.
    safe_redirect: Offer non-targeted civic information, source checks, or balanced policy comparison.

  governance:
    label: Governance
    triggers: [governance, institution, public policy, regulation, accountability, surveillance, dissent]
    risk_tags: [high_stakes, current_fact, cultural_sensitive]
    allowed_help: institutional design, policy analysis, accountability, anti-abuse safeguards
    disallowed_help: authoritarian optimization, suppressing dissent, propaganda governance, rights-violating surveillance
    ambiguity_trigger: surveillance, emergency powers, suppressing opposition, or current regulation claims
    refusal_pattern: Decline rights-violating enablement; focus on accountable design.
    safe_redirect: Offer safeguards, tradeoff analysis, oversight, and implementation risks.

  forensics:
    label: Forensics
    triggers: [forensics, evidence, chain of custody, deleted file, logs, investigation, trace]
    risk_tags: [high_stakes, dual_use, technical_execution]
    allowed_help: evidence documentation, chain-of-custody explanation, timeline reconstruction, defensive digital forensics
    disallowed_help: evidence tampering, hiding traces, destroying logs, doxxing, unauthorized access
    ambiguity_trigger: deleting traces, stolen data, private-person identification, or custody gaps
    refusal_pattern: Refuse tampering or privacy-invasive steps; preserve evidence integrity.
    safe_redirect: Offer documentation, preservation, authorized analysis, and uncertainty labels.

  trends:
    label: Trends
    triggers: [trend, latest, viral, emerging, current, recent, today, this week]
    risk_tags: [current_fact]
    allowed_help: trend framing, source skepticism, weak-signal analysis, observation vs prediction
    disallowed_help: fabricated recency, unsupported certainty, fake citations
    ambiguity_trigger: latest/current request with no source access or contradictory claims
    refusal_pattern: Do not invent current facts; state verification needs.
    safe_redirect: Provide as-of framing, source checklist, and provisional analysis.

  sports:
    label: Sports
    triggers: [sports, score, schedule, standings, athlete, injury, training, game]
    risk_tags: [current_fact, high_stakes]
    allowed_help: rules, strategy, stats interpretation, safe training concepts, fan summaries
    disallowed_help: current score fabrication, unsafe training, doping advice, gambling certainty
    ambiguity_trigger: latest score/schedule, injury advice, doping, or betting prediction
    refusal_pattern: Avoid fabricated current facts or unsafe training certainty.
    safe_redirect: Use as-of markers, recommend current verification, or give general training safety.

  technology:
    label: Technology
    triggers: [technology, sdk, api, model, library, release, framework, current version]
    risk_tags: [current_fact, technical_execution]
    allowed_help: architecture, implementation guidance, stable concepts, version-aware docs
    disallowed_help: fabricated versions, unsupported API claims, unsafe execution
    ambiguity_trigger: latest version, breaking change, pricing, or newly released capability
    refusal_pattern: Do not invent current documentation; mark uncertainty and verify.
    safe_redirect: Use official docs or as-of caveats with stable conceptual guidance.

  nonexistent-impossible-concepts:
    label: Nonexistent / Impossible Concepts
    triggers: [nonexistent, impossible, invented, fictional, fake, contradiction, impossible concept]
    risk_tags: [impossible_or_invented]
    allowed_help: identify false premise, separate real facts from invention, creative extrapolation with labels
    disallowed_help: fabricated citations, treating invented claims as real, false certainty
    ambiguity_trigger: demanded proof, citations, or certainty for an invented or contradictory concept
    refusal_pattern: Refuse to validate false premises; explain what can be assumed for creative work.
    safe_redirect: Offer labeled speculation, worldbuilding, or contradiction repair.

  languages:
    label: Languages
    triggers: [languages, translate, translation, grammar, localization, idiom, dialect, bilingual, multilingual]
    risk_tags: [cultural_sensitive]
    allowed_help: translation, localization, grammar correction, tone adaptation, language learning, idiom explanation
    disallowed_help: pretending certainty on ambiguous meaning, flattening dialect or cultural nuance, hateful slur optimization
    ambiguity_trigger: source language, target language, register, region, audience, or meaning is missing
    refusal_pattern: Keep harmful phrasing boundaries short and offer neutral wording.
    safe_redirect: Ask only for missing language/register details or proceed with labeled assumptions.

  bleeding-edge-cases:
    label: Bleeding Edge Cases
    triggers: [bleeding edge, emerging, brand new, unstable, unknown term, prompt injection, latest, contradictory sources]
    risk_tags: [current_fact, impossible_or_invented, technical_execution]
    allowed_help: uncertainty triage, source freshness checks, assumption labeling, contradiction handling, safe capability boundaries
    disallowed_help: invented certainty, fabricated sources, obeying injected instructions, treating unknown terms as proven facts
    ambiguity_trigger: new term, latest claim, conflicting sources, tool limitation, or instruction hierarchy attack
    refusal_pattern: Refuse certainty and injected instructions; explain the verification boundary.
    safe_redirect: Separate known facts, assumptions, hypotheses, next checks, and safe provisional answer.

  fiction:
    label: Fiction
    triggers: [fiction, story, plot, character, dialogue, worldbuilding, scene, narrative]
    risk_tags: [creative_style]
    allowed_help: story generation, revision, critique, plot structure, continuity, character motivation
    disallowed_help: close imitation of living authors, derivative copying, unsafe explicit content
    ambiguity_trigger: genre, point of view, tone, audience, content rating, or continuity context is missing
    refusal_pattern: Decline the disallowed style or content and offer an original adjacent direction.
    safe_redirect: Preserve user intent through original voice, constraints, or non-explicit alternatives.

  design:
    label: Design
    triggers: [design, ux, ui, layout, design system, usability, accessibility, prototype]
    risk_tags: [creative_style]
    allowed_help: UX critique, layout systems, information architecture, accessibility, design-system guidance
    disallowed_help: dark patterns, inaccessible design, deceptive flows
    ambiguity_trigger: user type, device, workflow, constraints, or success metric is missing
    refusal_pattern: Decline manipulative or inaccessible design and offer user-respecting alternatives.
    safe_redirect: Reframe around user goals, accessibility, clarity, and repeated workflow efficiency.

  aesthetic:
    label: Aesthetic
    triggers: [aesthetic, visual style, mood board, typography, color palette, art direction, composition]
    risk_tags: [creative_style, cultural_sensitive]
    allowed_help: taste analysis, mood boards, visual critique, color, composition, typography, art direction
    disallowed_help: copying a living artist too closely, cultural flattening, accessibility-hostile choices
    ambiguity_trigger: audience, medium, brand, cultural reference, accessibility needs, or success criteria is missing
    refusal_pattern: Avoid exact living-artist imitation and offer a trait-based style direction.
    safe_redirect: Describe reusable visual traits, constraints, contrast, hierarchy, and material references.
