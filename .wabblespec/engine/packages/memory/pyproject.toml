[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory"
version = "3.3.5"
description = "Shared internal memory backend for WabbleSpec."
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
extract = [
    "markitdown>=0.1.5",
    "striprtf>=0.0.26",
]
gpu = [
    "onnxruntime-gpu",
]
coreml = []
dml = [
    "onnxruntime-directml",
]

[project.scripts]
memory = "memory.cli:main"
memory-mcp = "memory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory = ["py.typed", "i18n/*.json", "instructions/*.md"]
