# standards/ folder index
# Auto-generated by the standards management workflow.
# Do not edit manually — run `organize --repair` to regenerate.

name: "{{project_name}} Standards"
version: "{{version}}"
last_updated: "{{last_updated}}"
owner: "{{owner_module_or_team}}"

standards:
  - id: "{{standard_id}}"
    title: "{{standard_title}}"
    path: "{{standard_file_path}}"
    domain: "{{domain}}"
    # domains: security | engineering | api | data | process | quality | compliance
    status: "{{status}}"
    # status: active | draft | deprecated | superseded
    applies_to:
      - "{{module_or_scope_1}}"
    supersedes: null
    # set to the id of the standard this replaces, or null
    last_reviewed: "{{last_reviewed_date}}"
    reviewers:
      - "{{reviewer_module_or_role}}"
    enforcement:
      automated: false
      # true if enforced by a check script or Guard rule
      check_path: null
      # path to enforcement script if automated: true
