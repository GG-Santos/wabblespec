framework:
  name: wabblespec
  version: 1.0.0-build
  description: Spec-driven, receipt-gated, hook-enforced framework for the complete software development lifecycle within a single agent runtime.

quality_floor:
  min_pattern_score: 4.0
  required_gates: [quick_validate, lint_prompts]
  adversarial_required_for_tags: [security, enforcement, receipt, gate]

cascade_policy:
  schema_change_triggers_revalidation: true
  shared_reference_change_triggers_revalidation: false

# ─────────────────────────────────────────────
# SHARED ARTIFACTS
# ─────────────────────────────────────────────
shared:
  schemas:
    - path: _shared/schemas/receipt.base.schema.json
      consumers: [recipe, specify, scope-frame, decompose, executor, verifier, guard, archive, reviewer, memory, memory-search, provenance, apply]
      version: "1.0"
    - path: _shared/schemas/error-event.schema.json
      consumers: [guard, verifier, executor, reviewer]
      version: "1.0"
    - path: _shared/schemas/skill-rules.schema.json
      consumers: []
      version: "1.0"
  references:
    - path: _shared/references/invariants.md
      consumers: [guard, verifier, executor, recipe, specify]
    - path: _shared/references/error-taxonomy.md
      consumers: [guard, verifier, executor, triage]
    - path: _shared/references/staleness-states.md
      consumers: [memory, memory-search, provenance, guard]

