name: Lint

on:
  push:
    paths:
      - '.wabblespec/engine/shared/scripts/**/*.py'
      - '.claude/skills/**/*.py'
  pull_request:
    paths:
      - '.wabblespec/engine/shared/scripts/**/*.py'
      - '.claude/skills/**/*.py'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: ruff check .wabblespec/engine/shared/scripts/ .claude/skills/
